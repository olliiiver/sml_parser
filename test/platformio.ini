[platformio]
src_dir = ./

[env:native]
platform = native
lib_deps = ../src
build_flags = -D SML_DEBUG -D SML_NATIVE -Wall -D UNITY_INCLUDE_DOUBLE
  ; abort on undefined behaviour; C++17 keeps negative left shifts undefined
  -std=gnu++17 -fsanitize=undefined -fno-sanitize-recover=undefined

[env:uno]
platform = atmelavr
board = uno
framework = arduino
;board_build.mcu = atmega328p
;board_build.f_cpu = 16000000L
build_flags = -D SML_DEBUG -D UNITY_INCLUDE_DOUBLE
lib_deps = ../src
